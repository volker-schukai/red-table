[package]
name = "red-table"
version = "0.4.0"
edition = "2024"
description = "A fast, keyboard-driven terminal image browser"
license = "MIT"
publish = false
rust-version = "1.90"

[[bin]]
name = "red-table"
path = "source/main.rs"

[lib]
name = "red_table"
path = "source/lib.rs"

[[bench]]
name = "thumbnail_resize"
harness = false

[[bench]]
name = "persistent_cache"
harness = false

[[bench]]
name = "kitty_protocol"
harness = false

[[bench]]
name = "inspection_view"
harness = false

[[bench]]
name = "selection_pipeline"
harness = false

[[bench]]
name = "comparison_view"
harness = false

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[dependencies]
base64-simd = "=0.8.0"
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
flate2 = "=1.1.10"
ignore = "0.4.23"
image = { version = "=0.25.9", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff", "bmp"] }
md5 = "0.8.0"
png = "=0.18.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.4"
url = "2.5.7"
